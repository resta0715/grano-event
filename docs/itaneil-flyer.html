<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; color: #fff; font-family: "Hiragino Sans", sans-serif; }
  .label {
    max-width: 210mm;
    margin: 12px auto 4px;
    padding: 0 8px;
    font-size: 16px;
    font-weight: 700;
  }
  img {
    display: block;
    width: 210mm;
    height: 297mm;
    margin: 0 auto;
    object-fit: cover;
  }
  @media screen {
    body { padding-bottom: 32px; }
    img { height: auto; max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  }
  @media print {
    .label { display: none; }
    img { break-after: page; page-break-after: always; }
    img:last-child { break-after: auto; page-break-after: auto; }
    html, body { background: #fff; }
  }
</style>
</head>
<body>
