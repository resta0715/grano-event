<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇部光太 — G.A.I.N.S.</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .stage {
    width: 100vw;
    height: 100dvh;
    display: grid;
    place-items: center;
    background: #000;
  }
  .deck {
    width: min(100vw, calc(100dvh * 16 / 9));
    height: min(100dvh, calc(100vw * 9 / 16));
    position: relative;
    background: #000;
  }
  .slide {
    display: none;
    position: absolute;
    inset: 0;
  }
  .slide.on { display: block; }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .count {
    position: absolute;
    z-index: 2;
    top: 2%;
    right: 2%;
    margin: 0;
    color: #fff;
    font: 900 2vw/1 "Hiragino Sans", "Yu Gothic", sans-serif;
    letter-spacing: 0.06em;
    text-shadow: 0 0.12em 0.3em #000;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="deck" id="deck">
    <p class="count" id="count">1 / 8</p>
    <section class="slide on"><img src="assets/gains-poster/slide-01.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-02.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-03.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-04.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-05.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-06.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-07.jpg" alt=""></section>
    <section class="slide"><img src="assets/gains-poster/slide-08.jpg" alt=""></section>
  </div>
</div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var count = document.getElementById("count");
  var cur = 0;
  function go(n) {
    cur = (n + slides.length) % slides.length;
    slides.forEach(function (s, i) { s.classList.toggle("on", i === cur); });
    count.textContent = (cur + 1) + " / " + slides.length;
    if (location.hash !== "#" + (cur + 1)) history.replaceState(null, "", "#" + (cur + 1));
  }
  document.addEventListener("keydown", function (e) {
    if (["ArrowRight", " ", "PageDown", "Enter"].indexOf(e.key) !== -1) { e.preventDefault(); go(cur + 1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].indexOf(e.key) !== -1) { e.preventDefault(); go(cur - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(slides.length - 1); }
  });
  var fromHash = parseInt((location.hash || "").slice(1), 10);
  if (fromHash >= 1 && fromHash <= slides.length) go(fromHash - 1);
})();
</script>
</body>
</html>
