<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一着をつくる｜大工原 葉子</title>
<meta name="description" content="大工原葉子の一着づくり。着物リメイクとオーダーメイド。">
<meta name="theme-color" content="#f4efe6">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ebe4d6;
  --app:#f7f1e6;
  --card:#fffdf8;
  --ink:#1c1612;
  --muted:#6d6256;
  --line:#e4d9c6;
  --gold:#b8893a;
  --gold-ink:#3a2c12;
  --ok:#2c6a4a;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",YuGothic,Meiryo,system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{
  min-height:100dvh;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.word{word-break:keep-all;line-break:strict}
.nowrap{white-space:nowrap}
.phone{
  width:100%;max-width:430px;min-height:100dvh;
  background:var(--app);display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(28,22,18,.08), 0 18px 50px rgba(28,22,18,.12);
  position:relative;
}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.is-on{display:flex}

.nav{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--app);border-bottom:1px solid var(--line);z-index:5;
}
.nav-back,.nav-x{
  width:40px;height:40px;border:0;background:transparent;font:inherit;
  font-size:22px;cursor:pointer;color:var(--ink);border-radius:12px;
}
.nav-back:active,.nav-x:active{background:rgba(28,22,18,.06)}
.nav-mid{flex:1;min-width:0}
.nav-title{font-size:16px;font-weight:700;line-height:1.3}
.nav-sub{font-size:12px;color:var(--muted);margin-top:1px}
.bar{height:3px;background:var(--line);margin:0 16px 0}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 110px}
h1{
  font-family:var(--serif);font-size:26px;line-height:1.4;font-weight:700;margin-bottom:6px;
}
.lead{font-size:15px;line-height:1.7;color:var(--muted);margin-bottom:16px}

.dock{
  position:absolute;left:0;right:0;bottom:0;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--app) 28%);
}
.dock-btn{
  width:100%;height:52px;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:700;
  cursor:pointer;background:var(--gold);color:#fff;
}
.dock-btn:disabled{background:#d9cbb3;color:#fff;cursor:not-allowed}
.ghost{
  width:100%;height:44px;margin-top:8px;border:0;background:transparent;font:inherit;
  font-size:15px;color:var(--muted);cursor:pointer;
}

.choice{
  display:grid;gap:10px;
}
.choice.cols{grid-template-columns:1fr 1fr}
.tile{
  display:block;width:100%;text-align:left;border:1.5px solid var(--line);
  background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;font:inherit;color:inherit;padding:0;
}
.tile img{display:block;width:100%;height:168px;object-fit:cover;background:#ddd}
.tile .meta{padding:11px 12px 13px}
.tile .nm{font-size:17px;font-weight:700}
.tile .bl{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.tile.is-on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,58,.22)}
.tile.is-on .nm{color:#8a641c}

.hero-card{
  border-radius:18px;overflow:hidden;position:relative;min-height:210px;
  border:0;width:100%;text-align:left;cursor:pointer;font:inherit;color:#fff;padding:0;
}
.hero-card .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-card .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,10,.15),rgba(20,14,10,.82))}
.hero-card .txt{position:relative;padding:28px 18px 20px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-card .k{font-size:12px;letter-spacing:.18em;opacity:.85;margin-bottom:6px}
.hero-card .t{font-family:var(--serif);font-size:28px;font-weight:700}
.hero-card .c{margin-top:6px;font-size:14px;line-height:1.6;opacity:.92}

.preview{
  background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;
}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pair figure{margin:0}
.pair img{width:100%;height:210px;object-fit:cover;display:block;background:#ddd}
.pair figcaption,.cap{
  padding:8px 10px 10px;font-size:12px;color:var(--muted);letter-spacing:.04em;
}
.arrow{
  display:none;
}
.summary{
  padding:14px 14px 4px;font-size:16px;font-weight:700;line-height:1.55;
}
.note{padding:0 14px 16px;font-size:13px;line-height:1.7;color:var(--muted)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 8px}
textarea{
  width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px;font:inherit;font-size:16px;line-height:1.6;background:#fff;color:var(--ink);
  resize:vertical;
}
.done-mark{
  width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:8px auto 14px;
}
.sheet{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px 8px;
}
.row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.55}
.row:first-child{border-top:0}
.row dt{width:5.2em;flex:none;color:var(--muted);font-size:12px;padding-top:3px}
.home-head{padding:22px 8px 10px;text-align:center}
.home-name{font-family:var(--serif);font-size:32px;font-weight:700}
.home-cat{margin-top:6px;font-size:14px;color:#8a641c;font-weight:700}
.home-lead{margin-top:10px;font-size:14px;line-height:1.7;color:var(--muted)}
.home-stack{display:grid;gap:12px;margin-top:8px}
.tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="phone" id="app">

<section id="gate" class="view is-on">
  <div class="scroll" style="padding-bottom:28px">
    <div class="home-head">
      <p class="tiny" style="margin:0 0 10px">DEMO</p>
      <h1 class="home-name word">大工原 葉子</h1>
      <p class="home-cat word">縫製職人</p>
      <p class="home-lead word">生地選び・型紙・縫製まで、<br>一人で一着をつくります。</p>
    </div>
    <div class="home-stack">
      <button type="button" class="hero-card" data-go="kimono">
        <span class="bg" style="background-image:url('assets/daikuhara/dk-kimono-baika.png')"></span>
        <span class="veil"></span>
        <span class="txt">
          <span class="k">メニュー 1</span>
          <span class="t word">着物リメイク</span>
          <span class="c word">タンスの着物を、服やバッグにする</span>
        </span>
      </button>
      <button type="button" class="hero-card" data-go="order">
        <span class="bg" style="background-image:url('assets/daikuhara/dk-atelier.png')"></span>
        <span class="veil"></span>
        <span class="txt">
          <span class="k">メニュー 2</span>
          <span class="t word">オーダーメイド</span>
          <span class="c word">欲しい服を、型紙から新しく作る</span>
        </span>
      </button>
    </div>
  </div>
</section>

<section id="flow" class="view">
  <div class="nav">
    <button type="button" class="nav-back" id="back" aria-label="戻る">‹</button>
    <div class="nav-mid">
      <p class="nav-title word" id="nav-title">着物リメイク</p>
      <p class="nav-sub" id="nav-sub">1 / 3</p>
    </div>
    <button type="button" class="nav-x" id="home" aria-label="閉じる">×</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="scroll" id="panel"></div>
  <div class="dock">
    <button type="button" class="dock-btn" id="next">次へ</button>
  </div>
</section>

<section id="done" class="view">
  <div class="nav">
    <span class="nav-back" style="visibility:hidden">‹</span>
    <div class="nav-mid"><p class="nav-title word">相談内容</p></div>
    <button type="button" class="nav-x" id="done-home" aria-label="閉じる">×</button>
  </div>
  <div class="scroll" id="done-body"></div>
  <div class="dock">
    <button type="button" class="dock-btn" id="again">最初から</button>
  </div>
</section>

</div>

<script>
const A = "assets/daikuhara/";
const KIMONOS = [
  { id:"baika", name:"紅梅", blurb:"クリーム地に、赤い梅", img:"dk-kimono-baika.png" },
  { id:"ai", name:"藍霞", blurb:"藍色に、白い麻の葉", img:"dk-kimono-ai.png" },
  { id:"tsuru", name:"金鶴", blurb:"黒地に、金の鶴", img:"dk-kimono-tsuru.png" }
];
const FORMS = [
  { id:"dress", name:"ワンピース", img:"dk-baika-dress.png" },
  { id:"jacket", name:"ジャケット", img:"dk-ai-jacket.png" },
  { id:"bag", name:"バッグ", img:"dk-baika-bag.png" },
  { id:"stole", name:"ストール", img:"dk-tsuru-stole.png" }
];
const REMAKE = {
  "baika:dress": "dk-baika-dress.png",
  "baika:bag":   "dk-baika-bag.png",
  "ai:jacket":   "dk-ai-jacket.png",
  "ai:bag":      "dk-ai-bag.png",
  "tsuru:stole": "dk-tsuru-stole.png",
  "tsuru:jacket":"dk-tsuru-vest.png"
};
const PIECES = [
  { id:"dress",  name:"ワンピース", img:"dk-order-linen-dress.png" },
  { id:"jacket", name:"ジャケット", img:"dk-order-wool-jacket.png" },
  { id:"pants",  name:"パンツ",     img:"dk-order-silk-pants.png" }
];
const FABRICS = [
  { id:"linen", name:"リネン", blurb:"生成り。夏向き", img:"dk-fabric-linen.png" },
  { id:"wool",  name:"ウール", blurb:"グレー。形が出る", img:"dk-fabric-wool.png" },
  { id:"silk",  name:"シルク", blurb:"黒。落ち感がある", img:"dk-fabric-silk.png" }
];
const ORDER_SHOT = {
  "dress:linen": "dk-order-linen-dress.png",
  "jacket:wool": "dk-order-wool-jacket.png",
  "pants:silk":  "dk-order-silk-pants.png"
};

const S = { path:null, step:1, kimono:null, form:null, piece:null, fabric:null, wish:"" };
const $ = (id) => document.getElementById(id);

function show(id){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("is-on", v.id === id));
  $("panel") && ($("panel").scrollTop = 0);
  $("done-body") && ($("done-body").scrollTop = 0);
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
}

document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
  S.path = b.dataset.go; S.step = 1; S.kimono = S.form = S.piece = S.fabric = null; S.wish = "";
  render(); show("flow");
});
$("home").onclick = $("done-home").onclick = $("again").onclick = () => { show("gate"); };
$("back").onclick = () => {
  if (S.step === 3 && $("wish")) S.wish = $("wish").value;
  if (S.step === 1){ show("gate"); return; }
  S.step -= 1; render();
};
$("next").onclick = () => {
  if (!canNext()) return;
  if (S.path === "kimono"){
    if (S.step === 1){ S.step = 2; render(); return; }
    if (S.step === 2){ S.step = 3; render(); return; }
    S.wish = ($("wish")||{}).value || "";
    finish();
  } else {
    if (S.step === 1){ S.step = 2; render(); return; }
    if (S.step === 2){ S.step = 3; render(); return; }
    S.wish = ($("wish")||{}).value || "";
    finish();
  }
};

function canNext(){
  if (S.path === "kimono"){
    if (S.step === 1) return !!S.kimono;
    if (S.step === 2) return !!S.form;
    return true;
  }
  if (S.step === 1) return !!S.piece;
  if (S.step === 2) return !!S.fabric;
  return true;
}
function setDock(){
  const last = S.step === 3;
  $("next").textContent = last ? "この内容で相談する" : "次へ";
  $("next").disabled = !canNext();
  $("bar").style.width = (S.step/3*100) + "%";
  $("nav-sub").textContent = S.step + " / 3";
  $("nav-title").textContent = S.path === "kimono" ? "着物リメイク" : "オーダーメイド";
}

function tiles(list, key, selected, cols){
  return `<div class="choice ${cols?"cols":""}">${list.map(x => `
    <button type="button" class="tile ${selected===x.id?"is-on":""}" data-id="${x.id}">
      <img src="${A+x.img}" alt="${x.name}">
      <span class="meta"><span class="nm word">${x.name}</span>${x.blurb?`<span class="bl word">${x.blurb}</span>`:""}</span>
    </button>`).join("")}</div>`;
}

function render(){
  const p = $("panel");
  if (S.path === "kimono"){
    if (S.step === 1){
      p.innerHTML = `<h1 class="word">どの着物にしますか</h1>
        <p class="lead word">いまは見本の3枚です。本番は、持ってきた着物を見ます。</p>
        ${tiles(KIMONOS,"kimono",S.kimono,false)}`;
      p.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { S.kimono = b.dataset.id; render(); });
    } else if (S.step === 2){
      p.innerHTML = `<h1 class="word">何に作り変えますか</h1>
        <p class="lead word">着物の生地を、この形に使います。</p>
        ${tiles(FORMS,"form",S.form,true)}`;
      p.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { S.form = b.dataset.id; render(); });
    } else {
      const k = KIMONOS.find(x => x.id === S.kimono);
      const f = FORMS.find(x => x.id === S.form);
      const after = REMAKE[S.kimono+":"+S.form] || f.img;
      p.innerHTML = `<h1 class="word">完成イメージ</h1>
        <p class="lead word">写真はイメージです。実物は、残りの生地と希望で変わります。</p>
        <div class="preview">
          <div class="pair">
            <figure><img src="${A+k.img}" alt="今の着物"><figcaption class="word">今の着物</figcaption></figure>
            <figure><img src="${A+after}" alt="完成イメージ"><figcaption class="word">完成イメージ</figcaption></figure>
          </div>
          <p class="summary word">${k.name}の着物を、${f.name}にします。</p>
          <p class="note word">柄の位置は、型紙を切るときに決めます。</p>
        </div>
        <label for="wish">希望・こだわり</label>
        <textarea id="wish" class="word" placeholder="母の振袖です。春のパーティーで着たい。">${escapeHtml(S.wish)}</textarea>`;
    }
  } else {
    if (S.step === 1){
      p.innerHTML = `<h1 class="word">何を作りますか</h1>
        <p class="lead word">既製品にないサイズも、一着に入れられます。</p>
        ${tiles(PIECES,"piece",S.piece,false)}`;
      p.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { S.piece = b.dataset.id; render(); });
    } else if (S.step === 2){
      p.innerHTML = `<h1 class="word">生地を選ぶ</h1>
        <p class="lead word">本番は触って決めます。いまは見本の3つです。</p>
        ${tiles(FABRICS,"fabric",S.fabric,false)}`;
      p.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { S.fabric = b.dataset.id; render(); });
    } else {
      const piece = PIECES.find(x => x.id === S.piece);
      const fab = FABRICS.find(x => x.id === S.fabric);
      const shot = ORDER_SHOT[S.piece+":"+S.fabric] || piece.img;
      p.innerHTML = `<h1 class="word">完成イメージ</h1>
        <p class="lead word">この生地で、この形を型紙から作ります。</p>
        <div class="preview">
          <div class="pair">
            <figure><img src="${A+fab.img}" alt="生地"><figcaption class="word">生地　${fab.name}</figcaption></figure>
            <figure><img src="${A+shot}" alt="形"><figcaption class="word">形　${piece.name}</figcaption></figure>
          </div>
          <p class="summary word">${fab.name}で、${piece.name}を一着つくります。</p>
          <p class="note word">肩・袖・着丈は、採寸して型紙に落とします。</p>
        </div>
        <label for="wish">希望・こだわり</label>
        <textarea id="wish" class="word" placeholder="既製品は肩が落ちる。袖は少し長めに。">${escapeHtml(S.wish)}</textarea>`;
    }
  }
  setDock();
}

function finish(){
  const pathName = S.path === "kimono" ? "着物リメイク" : "オーダーメイド";
  let pick = "";
  if (S.path === "kimono"){
    const k = KIMONOS.find(x => x.id === S.kimono);
    const f = FORMS.find(x => x.id === S.form);
    pick = `${k.name}の着物 → ${f.name}`;
  } else {
    const p = PIECES.find(x => x.id === S.piece);
    const f = FABRICS.find(x => x.id === S.fabric);
    pick = `${f.name}で ${p.name}`;
  }
  $("done-body").innerHTML = `
    <div class="done-mark">✓</div>
    <h1 class="word" style="text-align:center">相談内容をまとめました</h1>
    <p class="lead word" style="text-align:center">大工原 葉子さんへ渡す内容です。<br>この画面はデモなので、送信はしません。</p>
    <dl class="sheet">
      <div class="row"><dt>メニュー</dt><dd class="word">${pathName}</dd></div>
      <div class="row"><dt>内容</dt><dd class="word">${pick}</dd></div>
      <div class="row"><dt>希望</dt><dd class="word">${escapeHtml(S.wish) || "未記入"}</dd></div>
      <div class="row"><dt>次の予定</dt><dd class="word">実物を見る → 採寸 → 型紙 → 縫製</dd></div>
    </dl>`;
  show("done");
}
</script>
</body>
</html>
