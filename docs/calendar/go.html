<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>カレンダーに入れる</title>
<style>
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#121A30;color:#F5EFE6;text-align:center;
  font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  word-break:keep-all;
}
.box{padding:32px 24px;max-width:520px}
h1{font-size:clamp(36px,8vw,56px);line-height:1.3;margin:0 0 16px}
a{color:#E8C078;font-size:clamp(24px,5vw,32px);font-weight:700}
</style>
<script>
(function () {
  var ics = new URL("grano-events.ics", location.href).href;
  var ua = navigator.userAgent || "";
  var apple = /iPhone|iPad|iPod|Macintosh/.test(ua);
  var dest = apple
    ? ics
    : "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(ics.replace(/^https:/, "webcal:"));
  location.replace(dest);
})();
</script>
</head>
<body>
<div class="box">
  <h1>カレンダーを<br>開いています</h1>
  <p><a href="grano-events.ics">開かないときは、ここを押す</a></p>
</div>
</body>
</html>
